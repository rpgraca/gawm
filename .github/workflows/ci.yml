name: ci

on:
  push:
  pull_request:

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            autoconf \
            automake \
            gettext \
            autopoint \
            python3-numpy \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libxext-dev

      - name: Autoreconf (out-of-tree source)
        run: autoreconf -fi

      - name: Configure (out-of-tree build)
        run: |
          mkdir -p build
          cd build
          ../configure --disable-nls --enable-gawsound=no

      - name: Build (out-of-tree)
        run: |
          cd build
          make -j2

      - name: Check (make check)
        run: |
          cd build
          make check
